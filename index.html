<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاقتباسات">
<title>مستخرج الاقتباسات الذكي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .icon {
    font-size: 56px;
    margin-bottom: 12px;
    display: block;
  }
  h1 { font-size: 22px; margin-bottom: 10px; font-weight: 700; }
  .subtitle {
    font-size: 13px;
    opacity: 0.85;
    margin-bottom: 24px;
    line-height: 1.7;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    transition: transform 0.15s;
    font-family: inherit;
  }
  .btn-primary { background: #2f855a; }
  .btn-secondary { background: #2b6cb0; }
  .btn:active { transform: scale(0.96); }
  .steps {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.2);
    text-align: right;
    font-size: 12px;
    opacity: 0.9;
    line-height: 2;
  }
  .steps h3 { font-size: 13px; margin-bottom: 8px; opacity: 1; }
  .toast {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(0,0,0,0.85);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    transition: transform 0.3s;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="card">
  <span class="icon">✨</span>
  <h1>مستخرج الاقتباسات الذكي</h1>
  <p class="subtitle">
    أداة Pythonista لاستخراج اقتباسات ذكية<br>
    من ملفات PDF العربية باستخدام OpenRouter
  </p>

  <a href="script.py" download="quotes.py" class="btn btn-primary">
    📥 تحميل السكربت
  </a>

  <button class="btn btn-secondary" onclick="copyCode()">
    📋 نسخ الكود للحافظة
  </button>

  <div class="steps">
    <h3>📖 طريقة الاستخدام:</h3>
    1️⃣ حمّل أو انسخ السكربت<br>
    2️⃣ افتح Pythonista وأنشئ ملف <code>.py</code><br>
    3️⃣ الصق الكود واحفظ<br>
    4️⃣ شغّل ▶️
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
async function copyCode() {
  const toast = document.getElementById('toast');
  try {
    const res = await fetch('script.py');
    if (!res.ok) throw new Error('فشل التحميل');
    const code = await res.text();
    await navigator.clipboard.writeText(code);
    showToast('✅ تم نسخ الكود — افتح Pythonista والصقه');
  } catch (e) {
    showToast('❌ تعذر النسخ: ' + e.message);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
