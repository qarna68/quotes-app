<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الاقتباسات">
<title>مستخرج الاقتباسات الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Scheherazade+New:wght@400;700&family=Lateef:wght@400;700&family=Markazi+Text:wght@400;700&family=El+Messiri:wght@400;700&family=Mada:wght@400;700&family=Reem+Kufi:wght@400;700&family=Lalezar&family=Harmattan:wght@400;700&family=Rakkas&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'SF Arabic',system-ui,sans-serif;background:#f8f9fa;color:#1a1a1a;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));min-height:100vh}
.hidden{display:none !important}
#errBanner{position:fixed;top:0;left:0;right:0;background:#c53030;color:#fff;padding:10px;font-size:12px;z-index:9999;display:none;white-space:pre-wrap;max-height:200px;overflow-y:auto;font-family:monospace;direction:ltr;text-align:left}
h1{font-size:18px;text-align:center;margin-bottom:16px;font-weight:700}
.field{width:100%;padding:12px 14px;font-size:14px;border:1px solid #cbd5e0;border-radius:10px;background:#fff;margin-bottom:10px;font-family:inherit;direction:rtl}
.field:focus{outline:2px solid #2b6cb0;border-color:transparent}
.row{display:flex;gap:8px;margin-bottom:10px}
.btn{flex:1;padding:12px;font-size:14px;font-weight:700;border:none;border-radius:10px;color:#fff;font-family:inherit;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn-dark{background:#4a5568}.btn-blue{background:#2b6cb0}.btn-purple{background:#805ad5}.btn-green{background:#2f855a}.btn-red{background:#c53030}.btn-gray{background:#718096}.btn-gold{background:#b8945a}.btn-pink{background:#b83280}.btn-teal{background:#2c7a7b}.btn-orange{background:#c05621}
.status{text-align:center;font-size:12px;color:#718096;padding:8px;min-height:30px}
.status.ok{color:#2f855a;font-weight:700}.status.err{color:#c53030;font-weight:700}
.quotes{margin-top:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.star{font-size:24px;background:none;border:none;cursor:pointer;color:#a0aec0;padding:0;line-height:1}
.star.on{color:#d69e2e}
.q-num{font-weight:700;font-size:14px;color:#2b6cb0}
.q-text{font-size:15px;line-height:1.9;text-align:right;color:#1a1a1a;margin-bottom:12px;white-space:pre-wrap}
.card-actions{display:flex;gap:6px}
.card-actions .btn{font-size:12px;padding:8px}
.modal{position:fixed;inset:0;background:#f8f9fa;z-index:100;padding:16px;padding-top:max(16px,env(safe-area-inset-top));overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h2{font-size:18px}
.filter-row{display:flex;gap:8px;margin-bottom:12px}
.filter-row .btn{padding:10px;font-size:13px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,0,0,.9);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;transition:transform .3s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.progress{background:#e2e8f0;border-radius:8px;height:6px;overflow:hidden;margin:8px 0}
.progress-bar{background:#2b6cb0;height:100%;width:0;transition:width .3s}
.img-preview{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:300;display:flex;align-items:center;justify-content:center;padding:12px;flex-direction:column;gap:12px;overflow-y:auto}
.img-preview img{max-width:100%;max-height:38vh;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.img-preview .btn{max-width:200px}
.style-picker{display:flex;gap:6px;max-width:100%;flex-wrap:wrap;justify-content:center}
.style-chip{padding:6px 10px;border-radius:20px;font-size:11px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-family:inherit}
.style-chip.active{background:#b8945a;border-color:#b8945a;font-weight:700}
.style-chip:disabled{opacity:.5;cursor:wait}
#editPanel{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px}
#editTextarea{width:100%;height:110px;padding:12px;border-radius:10px;border:1px solid #4a5568;background:#1a202c;color:#fff;font-size:15px;font-family:inherit;direction:rtl;line-height:1.7;resize:vertical}
.preview-actions{display:flex;gap:8px;width:100%;max-width:500px;flex-wrap:wrap;justify-content:center}
.preview-actions .btn{padding:10px;font-size:13px;flex:1;min-width:90px}
.toggle-row{display:flex;gap:8px;width:100%;flex-wrap:wrap}
.toggle-btn{flex:1;padding:12px 6px;border-radius:10px;border:2px solid #718096;background:rgba(255,255,255,.1);color:#cbd5e0;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;appearance:none;user-select:none;touch-action:manipulation;transition:all .15s;min-height:48px;min-width:100px}
.toggle-btn:active{transform:scale(.96)}
.toggle-btn.on{background:#2f855a;border-color:#2f855a;color:#fff}
.toggle-btn.off{background:#718096;border-color:#718096;color:#fff}
.toggle-btn:disabled{opacity:.5}
.orientation-row{display:flex;gap:6px;width:100%;max-width:420px}
.orient-btn{flex:1;padding:10px 6px;border-radius:10px;border:2px solid #718096;background:rgba(255,255,255,.05);color:#cbd5e0;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.orient-btn.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff}
.orient-btn:active{transform:scale(.96)}
.video-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.video-box{background:#1a202c;color:#fff;padding:20px;border-radius:16px;max-width:400px;width:100%;text-align:center}
.video-box h3{font-size:16px;margin-bottom:12px}
.video-box p{font-size:13px;opacity:.8;margin-bottom:16px;line-height:1.7}
.video-progress{background:rgba(255,255,255,.1);border-radius:10px;height:10px;overflow:hidden;margin:16px 0}
.video-progress-bar{background:linear-gradient(90deg,#b83280,#b8945a);height:100%;width:0;transition:width .3s}
.video-percent{font-size:22px;font-weight:700;margin-bottom:8px;color:#b8945a}
.video-status{font-size:12px;opacity:.7}
#videoPlayer{width:100%;max-height:50vh;border-radius:12px;margin-bottom:14px;background:#000}
#videoFallback{width:100%;max-height:50vh;border-radius:12px;margin-bottom:14px;object-fit:contain}
.video-hint{font-size:11px;opacity:.75;margin-top:14px;line-height:1.7;color:#cbd5e0}
.video-btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.video-btn-row .btn{flex:1;min-width:110px;max-width:none;padding:12px;font-size:13px}
.format-badge{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-bottom:10px}
.format-badge.ok{background:rgba(47,133,90,.2);color:#68d391}
.format-badge.warn{background:rgba(214,158,46,.2);color:#f6e05e}
.duration-info{font-size:12px;opacity:.75;margin-bottom:12px;color:#cbd5e0}
</style>
</head>
<body>

<div id="errBanner" onclick="this.style.display='none'">⚠️ خطأ: <span id="errText"></span></div>

<div id="main">
  <h1>✨ استخراج اقتباسات ذكي</h1>
  <input id="apiKey" class="field" type="password" placeholder="مفتاح OpenRouter (sk-or-v1-...)">
  <input id="bookName" class="field" type="text" placeholder="اسم الكتاب (اختياري)">
  <input id="authorName" class="field" type="text" placeholder="اسم المؤلف (اختياري)">
  <select id="modelSelect" class="field">
    <option value="auto">🤖 النموذج: تلقائي (احتياطي)</option>
    <option value="google/gemini-2.5-flash">🚀 Gemini 2.5 Flash (غالباً الأسرع)</option>
    <option value="openai/gpt-oss-120b">⚡ GPT-OSS 120B</option>
    <option value="meta-llama/llama-3.3-70b-instruct">🦙 Llama 3.3 70B</option>
  </select>
  <input id="wmText" class="field" type="text" placeholder="نص العلامة المائية">
  <button id="wmToggleBtn" class="btn btn-gray" style="width:100%;margin-bottom:10px;">💧 إخفاء العلامة المائية</button>
  <button id="dateToggleBtn" class="btn btn-gray" style="width:100%;margin-bottom:10px;">📅 إخفاء التاريخ</button>
  <button id="pickPdfBtn" class="btn btn-dark" style="width:100%;margin-bottom:10px;">📕 اختيار ملف PDF</button>
  <input id="pdfInput" type="file" accept=".pdf" style="display:none;">
  <div class="row">
    <button id="countBtn" class="btn btn-gray">🔢 5</button>
    <button id="styleBtn" class="btn btn-gold">🎨 نسخي</button>
    <button id="libBtn" class="btn btn-purple">📚 المكتبة</button>
  </div>
  <button id="genBtn" class="btn btn-blue" style="width:100%;">استخراج ✨</button>
  <div id="status" class="status">ارفع ملف PDF للبدء</div>
  <div id="progressWrap" class="progress hidden"><div id="progressBar" class="progress-bar"></div></div>
  <div id="quotes" class="quotes"></div>
</div>

<div id="library" class="modal hidden">
  <div class="modal-head">
    <h2>📚 مكتبة الاقتباسات</h2>
    <button onclick="closeLibrary()" style="background:none;border:none;font-size:16px;color:#2b6cb0;cursor:pointer;">إغلاق</button>
  </div>
  <div class="filter-row">
    <button id="filterAll" class="btn btn-purple">الكل</button>
    <button id="filterFav" class="btn btn-gray">⭐ المفضلة</button>
  </div>
  <div id="libCount" style="text-align:center;font-size:12px;color:#718096;margin-bottom:12px;"></div>
  <div id="libList"></div>
</div>

<div id="imgPreview" class="img-preview hidden">
  <div class="style-picker">
    <button type="button" class="style-chip" data-style="paper">📄 قالب الورقة</button>
    <button type="button" id="photoChip" class="style-chip" data-style="photo">🖼️ صورتي</button>
  </div>
  <select id="fontSelect" class="field" style="max-width:420px;margin-bottom:0;">
    <option value="0">✒️ أميري</option>
    <option value="1">📜 نسخ</option>
    <option value="2">🖋️ عارف رقعة</option>
    <option value="3">🏛️ شهرزاد</option>
    <option value="4">🖊️ لطيف</option>
    <option value="5">📖 ماركازي</option>
    <option value="6">🌿 المسيري</option>
    <option value="7">✨ مادة</option>
    <option value="8">🪶 ريم كوفي</option>
    <option value="9">🎯 لالزار</option>
    <option value="10">🌙 هرمتان</option>
    <option value="11">🔶 رقاق</option>
  </select>

  <div class="orientation-row">
    <button type="button" id="orientPortrait" class="orient-btn on">📱 طولي</button>
    <button type="button" id="orientLandscape" class="orient-btn">🖥️ عرضي</button>
  </div>

  <img id="previewImg" alt="preview">
  <div id="editPanel" class="hidden">
    <textarea id="editTextarea" placeholder="عدّل النص هنا..."></textarea>
    <div class="toggle-row">
      <button type="button" id="toggleQuoteBtn" class="toggle-btn on">❝ علامة</button>
      <button type="button" id="toggleBookBtn" class="toggle-btn on">📖 الكتاب</button>
      <button type="button" id="toggleAuthorBtn" class="toggle-btn on">✍ المؤلف</button>
    </div>
  </div>
  <label class="duration-info" style="width:100%;max-width:420px;">
    🌑 تعتيم الخلفية
    <input id="overlayRange" type="range" min="0" max="90" value="45" style="width:100%;">
  </label>
  <input id="bgInput" type="file" accept="image/*" style="display:none;">
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:420px;">
    <button type="button" id="vZoomIn" class="btn btn-dark">🔍+</button>
    <button type="button" id="vZoomOut" class="btn btn-dark">🔍−</button>
    <button type="button" id="vUp" class="btn btn-dark">⬆️</button>
    <button type="button" id="vDown" class="btn btn-dark">⬇️</button>
    <button type="button" id="vLeft" class="btn btn-dark">⬅️</button>
    <button type="button" id="vRight" class="btn btn-dark">➡️</button>
    <button type="button" id="vReset" class="btn btn-gold">↺ إعادة</button>
  </div>
  <div class="duration-info" style="text-align:center;">أو اسحب الصورة بإصبعك لتحريكها</div>
  <div class="preview-actions">
    <button type="button" id="editQuoteBtn" class="btn btn-purple">✏️ تعديل</button>
    <button type="button" id="durationBtn" class="btn btn-teal">⏱️ 10 ث</button>
    <button type="button" id="animationBtn" class="btn btn-orange">✍️ كلمة</button>
    <button type="button" id="videoBtn" class="btn btn-pink">🎬 فيديو</button>
    <button type="button" id="regenBtn" class="btn btn-green hidden">🎨 توليد</button>
    <button type="button" id="saveBothBtn" class="btn btn-gold">📐 حفظ الاثنين</button>
    <button type="button" id="shareImgBtn" class="btn btn-blue">📤 مشاركة</button>
    <button type="button" id="bgBtn" class="btn btn-dark">🖼️ خلفية</button>
    <button type="button" id="xShareBtn" class="btn btn-dark">🐦 X</button>
    <button type="button" onclick="closePreview()" class="btn btn-red">إغلاق</button>
  </div>
</div>

<div id="videoOverlay" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 جاري توليد الفيديو...</h3>
    <p id="videoDurationInfo" class="duration-info"></p>
    <div class="video-percent" id="videoPercent">0%</div>
    <div class="video-progress"><div class="video-progress-bar" id="videoProgressBar"></div></div>
    <div class="video-status" id="videoStatus">بدء...</div>
  </div>
</div>

<div id="videoPreview" class="video-overlay hidden">
  <div class="video-box">
    <h3>🎬 الفيديو جاهز</h3>
    <div id="formatBadge" class="format-badge ok"></div>
    <video id="videoPlayer" controls playsinline style="display:none;"></video>
    <img id="videoFallback" alt="preview" style="display:none;">
    <div class="video-btn-row">
      <button type="button" id="shareVideoBtn" class="btn btn-blue">📤 مشاركة</button>
      <button type="button" id="downloadVideoBtn" class="btn btn-gold">💾 حفظ في الملفات</button>
      <button type="button" id="closeVideoBtn" class="btn btn-red">إغلاق</button>
    </div>
    <p class="video-hint" id="videoHint"></p>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
function showErr(msg){try{document.getElementById('errText').textContent=String(msg).substring(0,500);document.getElementById('errBanner').style.display='block'}catch(e){}}
window.addEventListener('error',function(ev){showErr((ev.message||'unknown')+' @ '+(ev.filename||'')+':'+(ev.lineno||''))});
window.addEventListener('unhandledrejection',function(ev){showErr('Promise: '+(ev.reason&&ev.reason.message?ev.reason.message:ev.reason))});
'use strict';

let pdfjsReady=false;
try{if(typeof pdfjsLib!=='undefined'&&pdfjsLib.GlobalWorkerOptions){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';pdfjsReady=true}}catch(e){showErr('pdfjs init: '+e.message)}

const STORAGE_KEY='quotes_library_v1';
const API_KEY_STORAGE='quotes_api_key';
const AUTHOR_STORAGE='quotes_author';
const STYLE_STORAGE='quotes_style';
const VARIANT_STORAGE='quotes_variant_index';
const DURATION_STORAGE='quotes_video_duration';
const ANIMATION_STORAGE='quotes_video_animation';
const ORIENTATION_STORAGE='quotes_orientation';

const STYLE_NAMES={paper:'📄 قالب الورقة',photo:'🖼️ صورتي',
  naskh:'📜 نسخي فاخر',oriental:'🌙 شرقي',classic:'🏛️ كلاسيكي',modern:'⚡ حديث',
  islamic:'🕌 إسلامي مزخرف',night:'🌌 ليلي بنجوم',news:'📰 خبر عاجل',emerald:'💡 نصيحة زمردي',
  sunset:'🌅 غروب ذهبي',ocean:'🌊 محيط عميق',royal:'👑 ملكي فاخر',sand:'🏜️ رملي دافئ',
  lightgold:'🪙 ذهبي فاتح'
};
const STYLE_ORDER=['paper','photo'];const _OLD_ORDER=['naskh','oriental','classic','modern','islamic','night','news','emerald','sunset','ocean','royal','sand','lightgold'];

const DURATION_OPTIONS=[5,10,15,20,30];
const ANIM_WORD='word',ANIM_LINE='line',ANIM_FADE='fade';
const ANIMATION_OPTIONS=[ANIM_WORD,ANIM_LINE,ANIM_FADE];
const ANIMATION_LABELS={[ANIM_WORD]:'✍️ كلمة',[ANIM_LINE]:'📝 سطر',[ANIM_FADE]:'✨ تدريجي'};
const ANIMATION_NAMES={[ANIM_WORD]:'كلمة بكلمة',[ANIM_LINE]:'سطر بسطر',[ANIM_FADE]:'تدريجي كامل'};

const FONT_FAMILY="Amiri, 'Noto Naskh Arabic', 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_B="'Aref Ruqaa', Amiri, 'Scheherazade New', Georgia, serif";
const FONT_FAMILY_C="'Scheherazade New', Amiri, Georgia, serif";

const SIZE_PORTRAIT={W:1080,H:1920};
const SIZE_LANDSCAPE={W:1920,H:1080};

let variantCounter=0;
try{variantCounter=parseInt(localStorage.getItem(VARIANT_STORAGE)||'0',10)}catch(e){}
function nextVariant(total){variantCounter=(variantCounter+1)%(total*1000);try{localStorage.setItem(VARIANT_STORAGE,String(variantCounter))}catch(e){}return variantCounter%total}

let generateLock=false,generateId=0,videoLock=false;

let state={
  pdfFile:null,pdfText:'',pdfName:'',authorName:'',
  quotes:[],quoteCount:5,library:[],currentHeader:'',
  busy:false,imageStyle:'paper',
  currentImageText:'',currentImageBlob:null,
  editMode:false,editedText:'',
  showQuote:true,showBook:true,showAuthor:true,
  currentVariantIdx:null,
  currentVideoBlob:null,currentVideoMime:'',currentVideoUrl:'',
  lastFrameDataUrl:'',videoDuration:10,animationType:ANIM_WORD,bgDataUrl:'',overlayOpacity:0.45,fontChoice:0,showWatermark:true,showDate:true,watermarkText:'تصميم / sab3-77',selectedModel:'auto',
  orientation:'portrait'
};

let fontsReady=false;
async function ensureFonts(){
  if(fontsReady)return;
  try{
    if(typeof document.fonts==='undefined'||!document.fonts.load){fontsReady=true;return}
    await Promise.all([
      document.fonts.load('400 40px Amiri').catch(()=>null),
      document.fonts.load('700 40px Amiri').catch(()=>null),
      document.fonts.load('400 40px "Noto Naskh Arabic"').catch(()=>null),
      document.fonts.load('700 40px "Noto Naskh Arabic"').catch(()=>null),
      document.fonts.load('400 40px "Aref Ruqaa"').catch(()=>null),
      document.fonts.load('700 40px "Aref Ruqaa"').catch(()=>null),
      document.fonts.load('400 40px "Scheherazade New"').catch(()=>null),
      document.fonts.load('700 40px "Scheherazade New"').catch(()=>null)
    ]);
    try{await document.fonts.ready}catch(e){}
    await new Promise(r=>setTimeout(r,300));
    fontsReady=true;
  }catch(e){fontsReady=true}
}

function loadLibrary(){try{const d=localStorage.getItem(STORAGE_KEY);state.library=d?JSON.parse(d):[]}catch(e){state.library=[]}}
function saveLibrary(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.library))}catch(e){}}
function toast(msg,ms){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),ms||2200)}
function setStatus(t,c){const el=document.getElementById('status');el.textContent=t;el.className='status'+(c?' '+c:'')}
function showProgress(s,p){const w=document.getElementById('progressWrap');const b=document.getElementById('progressBar');w.classList.toggle('hidden',!s);if(p!==undefined)b.style.width=p+'%'}

function loadApiKey(){
  try{
    const k=localStorage.getItem(API_KEY_STORAGE);if(k)document.getElementById('apiKey').value=k;
    const a=localStorage.getItem(AUTHOR_STORAGE);if(a){document.getElementById('authorName').value=a;state.authorName=a}
    const s=localStorage.getItem(STYLE_STORAGE);
    if(s&&STYLE_NAMES[s]){state.imageStyle=s;document.getElementById('styleBtn').textContent='🎨 '+STYLE_NAMES[s].split(' ').slice(1).join(' ')}
    const d=parseInt(localStorage.getItem(DURATION_STORAGE)||'0',10);
    if(DURATION_OPTIONS.includes(d))state.videoDuration=d;
    const an=localStorage.getItem(ANIMATION_STORAGE);
    if(an&&ANIMATION_OPTIONS.includes(an))state.animationType=an;

async function extractPdfText(file){
  if(!pdfjsReady)throw new Error('pdf.js لم يُحمّل، أعد تحميل الصفحة');
  let pdf;
  try{
    pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  }catch(e){
    if(e&&e.name==='PasswordException')throw new Error('الملف محمي بكلمة مرور، أزلها ثم أعد المحاولة');
    throw new Error('تعذر فتح ملف PDF: '+(e&&e.message?e.message:e));
  }
  const total=pdf.numPages;
  const WANT=30;
  let firstErr='';
  // المحاولة الأولى: صفحات متتالية من موقع عشوائي
  const collect=async(order,normalize)=>{
    let text='';let used=0;
    for(const pn of order){
      if(used>=WANT)break;
      try{
        const page=await pdf.getPage(pn);
        const content=await page.getTextContent();
        let pageText=content.items.map(it=>it.str||'').join(' ');
        if(normalize)pageText=pageText.normalize('NFKC');
        pageText=pageText.replace(/\s+/g,' ').trim();
        if(pageText.length<3)continue;
        text+=`[صفحة ${pn}]\n${pageText}\n\n`;
        used++;
      }catch(e){ if(!firstErr)firstErr=(e&&e.message)||String(e); }
      showProgress(true,Math.round(used/WANT*100));
    }
    return text;
  };
  const start=total>WANT?Math.floor(Math.random()*(total-WANT))+1:1;
  const forward=[];for(let i=start;i<=total;i++)forward.push(i);
  const backward=[];for(let i=start-1;i>=1;i--)backward.push(i);
  let text=await collect([...forward,...backward],true);
  // المحاولة الثانية: من أول الكتاب بالطريقة البسيطة إن فشلت الأولى
  if(!text.trim()){
    const all=[];for(let i=1;i<=total;i++)all.push(i);
    text=await collect(all,false);
  }
  showProgress(false);
  if(!text.trim()){
    throw new Error('لم يُعثر على نص قابل للقراءة في الملف.'+(firstErr?' (تفاصيل: '+firstErr+')':'')+' إن كان الملف ممسوحاً (صور) فلا يمكن استخراج النص منه.');
  }
  return {text,totalPages:total};
}

function cleanPdfText(text){
  text=text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g,'');
  text=text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  text=text.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'');
  text=text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
  return text.trim();
}

function cleanOutputText(text){
  text=text.replace(/<unk>/g,'').replace(/\[UNK\]/g,'');
  if(text.includes('```'))text=text.replace(/```[a-zA-Z]*\n/g,'').replace(/```/g,'');
  text=text.replace(/[\u4e00-\u9fff\u3040-\u309f\u30a0-\u30ff\uac00-\ud7af]+/g,'');
  text=text.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g,'');
  const lines=text.split('\n');
  const out=[];
  for(const line of lines){
    const s=line.trim();
    if(!s){out.push('');continue}
    if(/[\u0600-\u06FF]/.test(s)||/^\[?صفحة|^\d+\s*[\-\.\]\)]|^\d+$/.test(s))out.push(line);
  }
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

function parseQuotes(text){
  text=text.trim();
  if(!text)return [];
  const parts=('\n'+text).split(/\n(?=\s*\d+\s*[\.\-–—\)])/);
  const quotes=[];
  for(let p of parts){
    p=p.trim();if(!p)continue;
    p=p.replace(/^\s*\d+\s*[\.\-–—\)]\s*/,'');
    if(p&&p.length>20)quotes.push(p);
  }
  if(quotes.length<=1&&text.length>400){
    const chunks=text.split(/\n\n+/).map(c=>c.trim()).filter(c=>c);
    if(chunks.length>1)return chunks;
  }
  return quotes.length?quotes:[text];
}

function truncateAtLine(text,maxChars){
  if(text.length<=maxChars)return text;
  const cut=text.lastIndexOf('\n',maxChars);
  return text.substring(0,cut>0?cut:maxChars);
}

function prepareQuoteText(text){
  let t=String(text||'');
  t=t.replace(/\s*\[صفحة\s*\d+\]\s*/g,' ');
  t=t.replace(/\[\s*\]/g,' ');
  t=t.replace(/[\s،؛:\.\!\?؟\u060C\u061B\u061F\u066A-\u066D]+$/g,'');
  t=t.replace(/\s+/g,' ').trim();
  if(t.length)t=t+'.';
  return t;
}

function escapeXml(s){return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]))}

let _measureSvg=null,_measureText=null;
function measureSvgTextWidth(text,fontSize,fontWeight,fontFamily){
  const svgNS='http://www.w3.org/2000/svg';
  if(!_measureSvg){
    _measureSvg=document.createElementNS(svgNS,'svg');
    _measureSvg.setAttribute('xmlns',svgNS);
    _measureSvg.style.cssText='position:absolute;width:0;height:0;visibility:hidden;top:-9999px;';
    _measureText=document.createElementNS(svgNS,'text');
    _measureSvg.appendChild(_measureText);
    document.body.appendChild(_measureSvg);
  }
  _measureText.setAttribute('font-family',fontFamily||FONT_FAMILY);
  _measureText.setAttribute('font-size',String(fontSize));
  _measureText.setAttribute('font-weight',String(fontWeight||700));
  _measureText.setAttribute('direction','rtl');
  _measureText.setAttribute('text-anchor','middle');
  _measureText.setAttribute('x','500');
  _measureText.setAttribute('y','100');
  _measureText.textContent=text;
  let w=0;
  try{w=_measureText.getComputedTextLength()}catch(e){try{w=_measureText.getBBox().width}catch(e2){w=text.length*fontSize*0.5}}
  return w;
}

function wrapArabicText(text,maxWidth,fontSize,fontFamily){
  const lines=[];
  const paragraphs=text.split('\n');
  for(const para of paragraphs){
    if(!para.trim()){lines.push('');continue}
    const words=para.split(/\s+/);
    let current='';
    for(const word of words){
      const test=current?current+' '+word:word;
      const w=measureSvgTextWidth(test,fontSize,700,fontFamily);
      if(w>maxWidth&&current){lines.push(current);current=word}
      else current=test;
    }
    if(current)lines.push(current);
  }
  return lines;
}

function computeOptimalLayout(text,W,H,config,variant){
  const isPortrait=H>W;
  const len=text.length;
  let topDivider,bottomDivider,ABSOLUTE_MAX_WIDTH;
  if(isPortrait){
    topDivider=config.textTop||(config.isModern||config.isNews?200:340);
    bottomDivider=config.textBottom||(config.isModern||config.isNews?H-320:H-400);
    ABSOLUTE_MAX_WIDTH=(config.maxW||(W-400))*(variant.widthScale||1);
  }else{
    topDivider=config.isModern||config.isNews?100:150;
    bottomDivider=config.isModern||config.isNews?H-140:H-180;
    ABSOLUTE_MAX_WIDTH=Math.min(W-400,1500);
  }
  const availableHeight=bottomDivider-topDivider-(isPortrait?80:40);
  let fontSize;
  if(isPortrait){
    if(len<120)fontSize=84;else if(len<180)fontSize=76;else if(len<260)fontSize=68;
    else if(len<360)fontSize=60;else if(len<480)fontSize=52;else fontSize=46;
  }else{
    if(len<120)fontSize=72;else if(len<180)fontSize=64;else if(len<260)fontSize=58;
    else if(len<360)fontSize=52;else if(len<480)fontSize=46;else fontSize=42;
  }
  const lhRatio=isPortrait?1.85:1.75;
  let maxTextWidth=ABSOLUTE_MAX_WIDTH;
  let lineHeight=Math.round(fontSize*lhRatio);
  let lines=wrapArabicText(text,maxTextWidth,fontSize,variant.font);
  function hasAnyOverflow(lns,fs){
    for(const ln of lns){if(measureSvgTextWidth(ln,fs,700,variant.font)>ABSOLUTE_MAX_WIDTH+30)return true}
    return false;
  }
  let safety=0;
  while(safety<60){
    const tooTall=(lines.length*lineHeight)>availableHeight;
    const tooWide=hasAnyOverflow(lines,fontSize);
    if(!tooTall&&!tooWide)break;
    fontSize-=2;
    lineHeight=Math.round(fontSize*lhRatio);
    lines=wrapArabicText(text,maxTextWidth,fontSize,variant.font);
    safety++;
    if(fontSize<=24)break;
  }
  safety=0;
  const minLinesForGrow=isPortrait?4:3;
  const maxFontSize=isPortrait?115:90;
  while(lines.length<minLinesForGrow&&fontSize<maxFontSize&&safety<20){
    const nextFs=fontSize+3;
    const testLines=wrapArabicText(text,maxTextWidth,nextFs,variant.font);
    if(hasAnyOverflow(testLines,nextFs))break;
    if(testLines.length*Math.round(nextFs*lhRatio)>availableHeight)break;
    fontSize=nextFs;
    lineHeight=Math.round(fontSize*lhRatio);
    lines=testLines;
    safety++;
  }
  return {fontSize,maxTextWidth,lines,lineHeight,topDivider,bottomDivider,availableHeight};
}

function buildCornerSVG(cx,cy,dirX,dirY,size,color){
  const L=size;
  let g=`<g stroke="${color}" fill="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx+L*dirX}" y2="${cy}"/>`;
  g+=`<line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy+L*dirY}"/>`;
  g+=`<circle cx="${cx+L*dirX}" cy="${cy}" r="3"/>`;
  g+=`<circle cx="${cx}" cy="${cy+L*dirY}" r="3"/>`;
  g+=`<path d="M ${cx+40*dirX} ${cy} C ${cx+70*dirX} ${cy+25*dirY}, ${cx+100*dirX} ${cy+10*dirY}, ${cx+85*dirX} ${cy+35*dirY}" fill="none"/>`;
  g+=`<path d="M ${cx+55*dirX} ${cy+5*dirY} Q ${cx+75*dirX} ${cy-15*dirY} ${cx+90*dirX} ${cy+5*dirY} Q ${cx+75*dirX} ${cy+15*dirY} ${cx+55*dirX} ${cy+5*dirY} Z" stroke="none"/>`;
  g+=`<path d="M ${cx} ${cy+40*dirY} C ${cx+25*dirX} ${cy+70*dirY}, ${cx+10*dirX} ${cy+100*dirY}, ${cx+35*dirX} ${cy+85*dirY}" fill="none"/>`;
  g+=`<path d="M ${cx+5*dirX} ${cy+55*dirY} Q ${cx-15*dirX} ${cy+75*dirY} ${cx+5*dirX} ${cy+90*dirY} Q ${cx+15*dirX} ${cy+75*dirY} ${cx+5*dirX} ${cy+55*dirY} Z" stroke="none"/>`;
  g+='</g>';
  return g;
}

function buildDividerSVG(cx,y,width,color){
  if(!width)return '';
  const half=width/2;
  let g=`<g stroke="${color}" fill="${color}" stroke-width="1.5">`;
  g+=`<line x1="${cx-half}" y1="${y}" x2="${cx-15}" y2="${y}"/>`;
  g+=`<line x1="${cx+15}" y1="${y}" x2="${cx+half}" y2="${y}"/>`;
  g+=`<polygon points="${cx},${y-6} ${cx+6},${y} ${cx},${y+6} ${cx-6},${y}" stroke="none"/>`;
  g+=`<polygon points="${cx-half-6},${y-3} ${cx-half},${y} ${cx-half-6},${y+3} ${cx-half-12},${y}" stroke="none"/>`;
  g+=`<polygon points="${cx+half+6},${y-3} ${cx+half},${y} ${cx+half+6},${y+3} ${cx+half+12},${y}" stroke="none"/>`;
  g+='</g>';
  return g;
}

function buildKhatimPatternSVG(W,H,color,opacity){
  const spacing=110;
  let s=`<g stroke="${color}" fill="none" stroke-width="1.5" opacity="${opacity}">`;
  for(let y=-spacing;y<H+spacing;y+=spacing){
    for(let x=-spacing;x<W+spacing;x+=spacing){
      s+=`<rect x="${x-32}" y="${y-32}" width="64" height="64"/>`;
      s+=`<rect x="${x-32}" y="${y-32}" width="64" height="64" transform="rotate(45 ${x} ${y})"/>`;
      const ox=x+spacing/2,oy=y+spacing/2;

      s+=`<rect x="${ox-32}" y="${oy-32}" width="64" height="64" transform="rotate(45 ${ox} ${oy})"/>`;

    const baselineY=startY+i*lineHeight+fontSize*0.85;
    const common=`font-family="${font}" font-weight="700" font-size="${fontSize}" text-anchor="middle" direction="rtl"`;
    s+=`<text x="${cx+2}" y="${baselineY+3}" ${common} fill="${variant.textShadow}">${escapeXml(line)}</text>`;
    s+=`<text x="${cx-1}" y="${baselineY-1}" ${common} fill="${variant.textHighlight}">${escapeXml(line)}</text>`;
    s+=`<text x="${cx}" y="${baselineY}" ${common} fill="${variant.textColor}">${escapeXml(line)}</text>`;
  }
  s+=buildDividerSVG(cx,bottomDivider,config.bottomDividerWidth||240,config.ornamentColor);
  const footY=config.footerY||(isPortrait?H-200:H-120);
  const bookY=footY;
  const authorY=footY+50;
  if(showBook&&bookName){
    const bookText='\u{1F4D6} \uFD3F '+bookName+' \uFD3E';
    s+=`<text x="${cx}" y="${bookY}" font-family="${FONT_FAMILY}" font-weight="700" font-size="36" fill="${config.bookColor}" text-anchor="middle" direction="rtl">${escapeXml(bookText)}</text>`;
  }
  if(showAuthor&&authorName){
    const authorText='\u270D '+authorName;
    s+=`<text x="${cx}" y="${authorY}" font-family="${FONT_FAMILY}" font-weight="400" font-style="italic" font-size="28" fill="${config.authorColor}" text-anchor="middle" direction="rtl">${escapeXml(authorText)}</text>`;
  }
  function todayArabic(){
  try{
    return new Intl.DateTimeFormat('ar-EG-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
  }catch(e){
    return new Date().toLocaleDateString('ar');
  }
}
const wmPositions=[
    {x:W*0.25,y:H*0.16},{x:W*0.75,y:H*0.34},
    {x:W*0.28,y:H*0.56},{x:W*0.72,y:H*0.76}
  ];
  if(state.showDate)s+=`<text x="${cx}" y="${authorY+50}" font-family="${FONT_FAMILY}" font-weight="400" font-size="${config.dateSize||26}" fill="${config.authorColor}" text-anchor="middle" direction="rtl">📅 ${escapeXml(todayArabic())}</text>`;
  if(state.showWatermark)for(const p of wmPositions){
    s+=`<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="${FONT_FAMILY}" font-weight="700" font-size="34" fill="${config.watermarkColor}" opacity="0.12" text-anchor="middle" direction="rtl">${escapeXml(state.watermarkText)}</text>`;
  }
  s+=closeG;
  s+=viewClose(config);
  if(config.cardMovable)s+='</g>';
  return s+'</svg>';
}

async function generateQuoteImage(rawText,bookName,authorName,style,forceVariantIdx,orientation){
  await ensureFonts();
  const text=prepareQuoteText(rawText);
  const orient=orientation||state.orientation||'portrait';
  const size=orient==='portrait'?SIZE_PORTRAIT:SIZE_LANDSCAPE;
  const W=size.W,H=size.H;
  const isPortrait=orient==='portrait';
  const config=STYLE_CONFIGS[style]||STYLE_CONFIGS.naskh;
  const totalVariants=config.variants.length;
  let variantIdx;
  if(typeof forceVariantIdx==='number')variantIdx=forceVariantIdx%totalVariants;
  else if(typeof state.currentVariantIdx==='number'&&state.currentVariantIdx!==null)variantIdx=state.currentVariantIdx%totalVariants;
  else variantIdx=nextVariant(totalVariants);
  state.currentVariantIdx=variantIdx;
  const variant=config.variants[variantIdx];
  const layout=computeOptimalLayout(text,W,H,config,variant);
  const fontSize=layout.fontSize;
  const lines=layout.lines;
  const lineHeight=layout.lineHeight;
  const topDivider=layout.topDivider;
  const bottomDivider=layout.bottomDivider;
  const totalH=lines.length*lineHeight;
  const centerY=(topDivider+bottomDivider)/2;
  let startY=centerY-totalH/2;
  if(startY<topDivider+30)startY=topDivider+30;
  if(startY+totalH>bottomDivider-30)startY=bottomDivider-30-totalH;
  const cx=W/2;
  let svg;
  if(config.isModern){
    svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
    svg+=`<rect width="${W}" height="${H}" fill="#fefefe"/>`;
    svg+=bgLayerSVG(W,H,'#ffffff');
    svg+=`<rect x="0" y="0" width="14" height="${H}" fill="#0f172a"/>`;
    svg+=`<rect x="14" y="0" width="6" height="${H}" fill="#2b6cb0"/>`;
    const qmY=isPortrait?260:160;
    const qmSize=isPortrait?280:200;
    if(state.showQuote)svg+=`<text x="50" y="${qmY}" font-family="-apple-system, system-ui, sans-serif" font-weight="bold" font-size="${qmSize}" fill="#0f172a" text-anchor="start">&#8220;</text>`;
    for(let i=0;i<lines.length;i++){
      const line=lines[i];if(!line)continue;
      const y=startY+i*lineHeight+fontSize*0.85;
      svg+=`<text x="${cx}" y="${y}" font-family="${variant.font}" font-weight="800" font-size="${fontSize}" fill="${variant.textColor}" text-anchor="middle" direction="rtl">${escapeXml(line)}</text>`;
    }
    const lineY=Math.min(startY+totalH+80,H-(isPortrait?300:140));
    svg+=`<line x1="80" y1="${lineY}" x2="${W-100}" y2="${lineY}" stroke="#0f172a" stroke-width="3"/>`;
    svg+=`<circle cx="${W-100}" cy="${lineY}" r="8" fill="#2b6cb0"/>`;
    const bookOffY=isPortrait?60:40;
    const authorOffY=isPortrait?110:80;
    if(state.showBook&&bookName)svg+=`<text x="${cx}" y="${lineY+bookOffY}" font-family="-apple-system, ${FONT_FAMILY}" font-weight="700" font-size="32" fill="#0f172a" text-anchor="middle" direction="rtl">📖 ${escapeXml(bookName)}</text>`;
    if(state.showAuthor&&authorName)svg+=`<text x="${cx}" y="${lineY+authorOffY}" font-family="-apple-system, ${FONT_FAMILY}" font-size="26" fill="#64748b" text-anchor="middle" direction="rtl">✍ ${escapeXml(authorName)}</text>`;
    if(state.showDate)svg+=`<text x="${cx}" y="${lineY+160}" font-family="-apple-system, ${FONT_FAMILY}" font-size="26" fill="#64748b" text-anchor="middle" direction="rtl">📅 ${escapeXml(todayArabic())}</text>`;
    const wm=[{x:W*0.25,y:H*0.18},{x:W*0.75,y:H*0.36},{x:W*0.28,y:H*0.58},{x:W*0.72,y:H*0.78}];
    if(state.showWatermark)for(const p of wm)svg+=`<text transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)}) rotate(-22)" font-family="-apple-system, system-ui" font-weight="700" font-size="34" fill="#0f172a" opacity="0.07" text-anchor="middle">${escapeXml(state.watermarkText)}</text>`;
    svg+='</svg>';
  }else{
    svg=buildQuoteSVG({W,H,lines,fontSize,lineHeight,startY,topDivider,bottomDivider,bookName,authorName,config,variant,showQuote:state.showQuote,showBook:state.showBook,showAuthor:state.showAuthor});
  }
  const outCanvas=await svgToCanvas(svg,W,H);
  return new Promise(resolve=>outCanvas.toBlob(b=>resolve(b),'image/png'));
}

async function svgToCanvas(svgString,W,H){
  try{
    await Promise.all(FONT_CHOICES.flatMap(f=>[
      document.fonts.load('400 40px '+f.css).catch(()=>null),
      document.fonts.load('700 40px '+f.css).catch(()=>null)
    ]));
  }catch(e){}
  // نرسم النصوص من الصفحة نفسها لتستخدم الخطوط المحمّلة، والباقي يُرسم كصورة SVG
  const holder=document.createElement('div');
  holder.style.cssText='position:absolute;left:-99999px;top:0;visibility:hidden;';
  holder.innerHTML=svgString;
  document.body.appendChild(holder);
  const root=holder.querySelector('svg');
  const texts=[];
  root.querySelectorAll('text').forEach(t=>{
    let op=1,n=t;
    while(n&&n.getAttribute){const o=n.getAttribute('opacity');if(o!==null)op*=parseFloat(o);n=n.parentNode;}
    const m=t.getCTM()||{a:1,b:0,c:0,d:1,e:0,f:0};
    texts.push({
      str:t.textContent,
      x:parseFloat(t.getAttribute('x')||'0'),
      y:parseFloat(t.getAttribute('y')||'0'),
      size:parseFloat(t.getAttribute('font-size')||'20'),
      weight:t.getAttribute('font-weight')||'400',
      style:t.getAttribute('font-style')||'normal',
      family:t.getAttribute('font-family')||'serif',
      fill:t.getAttribute('fill')||'#000',
      anchor:t.getAttribute('text-anchor')||'start',
      op:op,m:m
    });
  });
  root.querySelectorAll('text').forEach(t=>t.remove());
  let svgOut=new XMLSerializer().serializeToString(root);
  holder.remove();
  if(!/xmlns=/.test(svgOut.slice(0,300)))svgOut=svgOut.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');
  const blob=new Blob([svgOut],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('فشل تحميل الصورة'));img.src=url;});
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.drawImage(img,0,0,W,H);
  URL.revokeObjectURL(url);
  for(const o of texts){
    ctx.save();
    ctx.setTransform(o.m.a,o.m.b,o.m.c,o.m.d,o.m.e,o.m.f);
    ctx.globalAlpha=o.op;
    ctx.font=o.style+' '+o.weight+' '+o.size+'px '+o.family;
    ctx.fillStyle=o.fill;
    ctx.textAlign=o.anchor==='middle'?'center':(o.anchor==='end'?'end':'start');
    ctx.textBaseline='alphabetic';
    ctx.fillText(o.str,o.x,o.y);
    ctx.restore();
  }
  return canvas;
}
async function svgToImage(svg){
  const c=await svgToCanvas(svg,1080,1920);
  return {img:c,url:null};
}


function bgLayerSVG(W,H,overlayColor){
  if(!state.bgDataUrl||state.imageStyle!=='photo')return '';
  return `<image href="${state.bgDataUrl}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="xMidYMid slice"/>`+
         `<rect width="${W}" height="${H}" fill="${overlayColor||'#000'}" opacity="${state.overlayOpacity}"/>`;
}
async function loadBgFromFile(file){
  const url=URL.createObjectURL(file);
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
  const W=1080,H=1920;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const s=Math.max(W/img.naturalWidth,H/img.naturalHeight);
  const w=img.naturalWidth*s,h=img.naturalHeight*s;
  ctx.drawImage(img,(W-w)/2,(H-h)/2,w,h);
  URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg',0.9);
}

function pickBestMimeType(){
  const candidates=[
    'video/mp4;codecs=avc1.64001E','video/mp4;codecs=avc1.4D401E','video/mp4;codecs=avc1.42E01E',
    'video/mp4;codecs=h264','video/mp4;codecs=avc1','video/mp4',
    'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'
  ];
  for(const c of candidates){
    try{if(MediaRecorder.isTypeSupported(c))return c}catch(e){}
  }
  return 'video/webm';
}

  const centerY=(topDivider+bottomDivider)/2;
  let startY=centerY-totalH/2;
  if(startY<topDivider+30)startY=topDivider+30;
  if(startY+totalH>bottomDivider-30)startY=bottomDivider-30-totalH;
  const wordSeq=[];
  originalLines.forEach((line,li)=>{
    if(!line.trim())return;
    line.split(/\s+/).filter(w=>w).forEach(w=>wordSeq.push({line:li,word:w}));
  });
  const totalWords=wordSeq.length;
  function buildPartialLines(upToWords){
    const lineWords=new Array(originalLines.length).fill(null).map(()=>[]);
    for(let i=0;i<upToWords&&i<totalWords;i++){
      const w=wordSeq[i];
      lineWords[w.line].push(w.word);
    }
    return lineWords.map(arr=>arr.join(' '));
  }
  function buildPartialLinesByLine(upToLines){
    const result=new Array(originalLines.length).fill('');
    let visibleCount=0;
    for(let i=0;i<originalLines.length;i++){
      if(!originalLines[i].trim()){result[i]='';continue}
      if(visibleCount<upToLines)result[i]=originalLines[i];
      visibleCount++;
    }
    return result;
  }
  function buildFrameSVG(frameState){
    if(frameState.mode==='fade'){
      return buildQuoteSVG({
        W,H,lines:originalLines,fontSize,lineHeight,startY,topDivider,bottomDivider,
        bookName:state.showBook?state.pdfName:'',
        authorName:state.showAuthor?state.authorName:'',
        config,variant,showQuote:state.showQuote,showBook:state.showBook,showAuthor:state.showAuthor,
        textOpacity:frameState.opacity
      });
    }
    return buildQuoteSVG({
      W,H,lines:frameState.lines,fontSize,lineHeight,startY,topDivider,bottomDivider,
      bookName:state.showBook?state.pdfName:'',
      authorName:state.showAuthor?state.authorName:'',
      config,variant,showQuote:state.showQuote,showBook:state.showBook,showAuthor:state.showAuthor
    });
  }
  const frameStates=[];
  if(state.animationType===ANIM_WORD){
    const MAX_FRAMES=40;
    const step=Math.max(1,Math.ceil(totalWords/MAX_FRAMES));
    const counts=[];
    for(let i=0;i<=totalWords;i+=step)counts.push(i);
    if(counts[counts.length-1]!==totalWords)counts.push(totalWords);
    for(const c of counts)frameStates.push({mode:'word',wordCount:c,lines:buildPartialLines(c)});
  }else if(state.animationType===ANIM_LINE){
    const lineCount=originalLines.filter(l=>l.trim()).length;
    for(let i=0;i<=lineCount;i++)frameStates.push({mode:'line',lineCount:i,lines:buildPartialLinesByLine(i)});
  }else{
    const STEPS=30;
    for(let i=0;i<=STEPS;i++)frameStates.push({mode:'fade',opacity:i/STEPS});
  }
  const prerenderedImages=[];
  const revokeUrls=[];
  for(let i=0;i<frameStates.length;i++){
    updateVideoProgress(0.05+(i/frameStates.length)*0.55,`رسم الإطارات... ${i+1}/${frameStates.length}`);
    const {img,url}=await svgToImage(buildFrameSVG(frameStates[i]));
    if(url)revokeUrls.push(url);
    prerenderedImages.push(img);
    await new Promise(r=>setTimeout(r,8));
  }
  const lastFrameCanvas=document.createElement('canvas');
  lastFrameCanvas.width=W;lastFrameCanvas.height=H;
  const lfc=lastFrameCanvas.getContext('2d');
  lfc.fillStyle='#ffffff';lfc.fillRect(0,0,W,H);
  lfc.drawImage(prerenderedImages[prerenderedImages.length-1],0,0,W,H);
  state.lastFrameDataUrl=lastFrameCanvas.toDataURL('image/png');
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.drawImage(prerenderedImages[prerenderedImages.length-1],0,0,W,H);
  const FPS=24;
  const totalMs=state.videoDuration*1000;
  const holdMs=Math.min(5000,totalMs-3000);
  const animMs=totalMs-holdMs;
  const stream=canvas.captureStream(FPS);
  const mimeType=pickBestMimeType();
  let recorder;
  try{recorder=new MediaRecorder(stream,{mimeType,videoBitsPerSecond:5000000})}
  catch(e){revokeUrls.forEach(u=>URL.revokeObjectURL(u));throw new Error('تعذر بدء التسجيل: '+e.message)}
  const chunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data)};
  function drawFrameAt(elapsedMs){
    let frameIdx;
    if(elapsedMs<animMs){
      const progress=elapsedMs/animMs;
      frameIdx=Math.min(prerenderedImages.length-1,Math.floor(progress*prerenderedImages.length));
    }else frameIdx=prerenderedImages.length-1;
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
    ctx.drawImage(prerenderedImages[frameIdx],0,0,W,H);
  }
  return new Promise((resolve,reject)=>{
    try{
      recorder.start();
      const startTime=performance.now();
      let lastFrame=-1;
      function tick(){
        const elapsed=performance.now()-startTime;
        if(elapsed>=totalMs){try{recorder.stop()}catch(e){reject(e)}return}
        const currentFrame=Math.floor((elapsed/1000)*FPS);
        if(currentFrame!==lastFrame){lastFrame=currentFrame;drawFrameAt(elapsed)}
        updateVideoProgress(0.6+(elapsed/totalMs)*0.4,`التسجيل... ${((elapsed/totalMs)*100).toFixed(0)}%`);
        requestAnimationFrame(tick);
      }
      recorder.onstop=()=>{
        try{
          const blob=new Blob(chunks,{type:mimeType});
          revokeUrls.forEach(u=>URL.revokeObjectURL(u));
          resolve({blob,mimeType});
        }catch(e){reject(e)}
      };
      recorder.onerror=()=>reject(new Error('فشل التسجيل'));
      tick();
    }catch(e){revokeUrls.forEach(u=>URL.revokeObjectURL(u));reject(e)}
  });
}

async function shareVideoFile(blob,mimeType){
  const ext=mimeType.includes('mp4')?'mp4':'webm';
  const file=new File([blob],'quote.'+ext,{type:mimeType});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'اقتباس'});return true}
    catch(e){if(e.name==='AbortError')return true;return false}
  }
  return false;
}

function downloadVideoFile(blob,mimeType){
  const ext=mimeType.includes('mp4')?'mp4':'webm';
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='quote-'+Date.now()+'.'+ext;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

    videoLock=false;toast('❌ المتصفح لا يدعم توليد الفيديو');return;
  }
  const totalMs=state.videoDuration*1000;
  const holdMs=Math.min(5000,totalMs-3000);
  const animMs=totalMs-holdMs;
  const infoEl=document.getElementById('videoDurationInfo');
  if(infoEl)infoEl.innerHTML='⏱️ المدة: '+state.videoDuration+' ث (<b>'+(animMs/1000).toFixed(1)+' ث حركة</b> + '+(holdMs/1000).toFixed(1)+' ث ثبات)<br>🎬 الحركة: '+ANIMATION_NAMES[state.animationType];
  document.getElementById('videoOverlay').classList.remove('hidden');
  updateVideoProgress(0,'جاري التحضير...');
  try{
    const {blob,mimeType}=await generateQuoteVideo(state.editedText||state.currentImageText,state.imageStyle);
    state.currentVideoBlob=blob;
    state.currentVideoMime=mimeType;
    document.getElementById('videoOverlay').classList.add('hidden');
    if(state.currentVideoUrl)URL.revokeObjectURL(state.currentVideoUrl);
    state.currentVideoUrl=URL.createObjectURL(blob);
    const playable=canPlayVideoType(mimeType);
    const isMp4=mimeType.includes('mp4');
    const videoEl=document.getElementById('videoPlayer');
    const fallbackImg=document.getElementById('videoFallback');
    const formatBadge=document.getElementById('formatBadge');
    const hint=document.getElementById('videoHint');
    if(playable){
      videoEl.src=state.currentVideoUrl;
      videoEl.style.display='block';
      fallbackImg.style.display='none';
      formatBadge.textContent='✅ '+(isMp4?'MP4':'WebM')+' — '+state.videoDuration+' ث ('+ANIMATION_NAMES[state.animationType]+')';
      formatBadge.className='format-badge ok';
      hint.innerHTML=isMp4?'💡 <b>لحفظ الفيديو في تطبيق الصور:</b><br>اضغط "📤 مشاركة" ثم اختر <b>"حفظ الفيديو"</b> من قائمة iOS.':'💡 <b>للمشاركة:</b> اضغط "📤 مشاركة" لإرساله على WhatsApp/Telegram.<br>⚠️ لحفظه في الصور، استخدم CapCut.';
    }else{
      videoEl.style.display='none';
      fallbackImg.src=state.lastFrameDataUrl;
      fallbackImg.style.display='block';
      formatBadge.textContent='⚠️ '+(isMp4?'MP4':'WebM')+' — '+state.videoDuration+' ث';
      formatBadge.className='format-badge warn';
      hint.innerHTML='💡 <b>الفيديو جاهز لكن Safari لا يمكنه معاينته.</b><br>• للمشاركة المباشرة: اضغط "📤 مشاركة".<br>• للحفظ في الصور: اضغط "💾 حفظ في الملفات" ثم افتحه في <b>CapCut</b>.';
    }
    document.getElementById('videoPreview').classList.remove('hidden');
    document.getElementById('shareVideoBtn').onclick=async()=>{
      toast('📤 جاري فتح قائمة المشاركة...',1500);
      const ok=await shareVideoFile(blob,mimeType);
      if(!ok)toast('❌ تعذر — استخدم "حفظ في الملفات"',2500);
    };

    };

  }catch(e){
    document.getElementById('videoOverlay').classList.add('hidden');
    toast('❌ فشل توليد الفيديو: '+e.message,3000);
  }finally{videoLock=false}
}

function findQuote(text,book){return state.library.find(q=>q.text===text&&q.book===book)}
function isFavorite(text,book){const q=findQuote(text,book);return !!(q&&q.favorite)}
function ensureInLibrary(text,book){
  let q=findQuote(text,book);
  if(!q){
    q={id:(crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random()),text,book,favorite:false,date:new Date().toISOString()};
    state.library.push(q);saveLibrary();
  }
  return q;
}
function toggleFavorite(text,book){const q=ensureInLibrary(text,book);q.favorite=!q.favorite;saveLibrary()}
function openLibrary(){document.getElementById('library').classList.remove('hidden');renderLibrary('all')}
function closeLibrary(){document.getElementById('library').classList.add('hidden')}

function renderLibrary(filter){
  const list=document.getElementById('libList');list.innerHTML='';
  let items=filter==='fav'?state.library.filter(q=>q.favorite):[...state.library];
  items.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  document.getElementById('libCount').textContent=items.length+' اقتباس';
  document.getElementById('filterAll').className='btn '+(filter==='all'?'btn-purple':'btn-gray');
  document.getElementById('filterFav').className='btn '+(filter==='fav'?'btn-purple':'btn-gray');
  if(!items.length){list.innerHTML='<div style="text-align:center;color:#a0aec0;padding:30px;">لا توجد اقتباسات بعد</div>';return}
  items.forEach(q=>{
    const card=document.createElement('div');
    card.className='card';
    const dateStr=(q.date||'').substring(0,10);
    card.innerHTML=`
      <div class="card-head">
        <button class="star ${q.favorite?'on':''}">${q.favorite?'★':'☆'}</button>
        <span style="font-size:11px;color:#4a5568;">📕 ${escapeHtml(q.book||'')} · ${dateStr}</span>
      </div>
      <div class="q-text">${escapeHtml(q.text)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-act="copy">📋</button>
        <button class="btn btn-blue" data-act="share">📤</button>
        <button class="btn btn-purple" data-act="image">📸</button>
        <button class="btn btn-red" data-act="del">🗑</button>
      </div>`;
    card.querySelector('.star').addEventListener('click',()=>{q.favorite=!q.favorite;saveLibrary();renderLibrary(filter)});
    card.querySelector('[data-act="copy"]').addEventListener('click',()=>copyQuote(q.text));
    card.querySelector('[data-act="share"]').addEventListener('click',()=>shareQuote(q.text));
    card.querySelector('[data-act="image"]').addEventListener('click',()=>showQuoteImage(q.text));
    card.querySelector('[data-act="del"]').addEventListener('click',()=>{
      if(confirm('حذف؟')){state.library=state.library.filter(x=>x.id!==q.id);saveLibrary();renderLibrary(filter)}
    });
    list.appendChild(card);
  });
}

function renderQuotes(){
  const container=document.getElementById('quotes');
  container.innerHTML='';
  if(!state.quotes.length)return;
  const header=document.createElement('div');
  header.style.cssText='font-size:13px;color:#4a5568;text-align:right;padding:8px;margin-bottom:8px;line-height:1.7;';
  header.textContent=state.currentHeader;
  container.appendChild(header);
  state.quotes.forEach((quote,i)=>{
    const card=document.createElement('div');
    card.className='card';
    const isFav=isFavorite(quote,state.pdfName);
    card.innerHTML=`
      <div class="card-head">
        <button class="star ${isFav?'on':''}" data-idx="${i}">${isFav?'★':'☆'}</button>
        <span class="q-num">❝ اقتباس ${i+1}</span>
      </div>
      <div class="q-text">${escapeHtml(quote)}</div>
      <div class="card-actions">
        <button class="btn btn-green" data-action="copy" data-idx="${i}">📋 نسخ</button>
        <button class="btn btn-blue" data-action="share" data-idx="${i}">📤 مشاركة</button>
        <button class="btn btn-purple" data-action="image" data-idx="${i}">📸 صورة</button>
      </div>`;
    container.appendChild(card);
  });
  container.querySelectorAll('.star').forEach(b=>b.addEventListener('click',()=>{
    toggleFavorite(state.quotes[parseInt(b.dataset.idx)],state.pdfName);renderQuotes();
  }));
  container.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{
    const idx=parseInt(b.dataset.idx);
    const t=state.quotes[idx];
    if(b.dataset.action==='copy')copyQuote(t);
    else if(b.dataset.action==='share')shareQuote(t);
    else showQuoteImage(t);
  }));
}

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function copyQuote(text){try{await navigator.clipboard.writeText(text);toast('✅ تم النسخ')}catch(e){toast('❌ فشل النسخ')}}
async function shareQuote(text){
  if(navigator.share){try{await navigator.share({text})}catch(e){if(e.name!=='AbortError')copyQuote(text)}}
  else copyQuote(text);
}

async function generate(){
  if(state.busy)return;
  const apiKey=document.getElementById('apiKey').value.trim();
  if(!apiKey){toast('❌ أدخل مفتاح OpenRouter');return}
  if(!state.pdfFile){toast('❌ اختر PDF أولاً');return}
  saveApiKey(apiKey);
  state.busy=true;
  const genBtn=document.getElementById('genBtn');
  genBtn.disabled=true;genBtn.textContent='⏳ جاري الاستخراج...';
  try{
    setStatus('جاري قراءة PDF...');showProgress(true,0);
    const {text}=await extractPdfText(state.pdfFile);
    let cleaned=truncateAtLine(cleanPdfText(text),12000);
    if(!cleaned.trim()){setStatus('لم يُعثر على نص','err');return}
    setStatus('جاري الاتصال بالنموذج...');
    const {text:answer,model}=await callOpenRouter(apiKey,state.pdfName,cleaned,state.quoteCount);
    const quotes=parseQuotes(answer);
    state.quotes=quotes;
    state.currentHeader='📕 '+state.pdfName+'\n🤖 '+model.split('/').pop();
    quotes.forEach(q=>ensureInLibrary(q,state.pdfName));
    renderQuotes();
    setStatus(`✓ ${quotes.length} اقتباسات — اضغط مجدداً`,'ok');
    genBtn.textContent='🔄 اقتباسات جديدة';
  }catch(e){
    setStatus('حدث خطأ','err');
    document.getElementById('quotes').innerHTML='<div class="card" style="color:#c53030;text-align:center;padding:20px;">حدث خطأ:<br><br>'+escapeHtml(e.message)+'</div>';
  }finally{
    state.busy=false;genBtn.disabled=false;showProgress(false);
  }
}

    });
    document.getElementById('toggleAuthorBtn').addEventListener('click',async()=>{
      state.showAuthor=!state.showAuthor;updateToggleUI();
      toast(state.showAuthor?'✍ إظهار المؤلف':'🚫 إخفاء المؤلف',1200);
      await regenerateCurrent();
    });

    updateToggleUI();
    updateDurationButton();
    updateAnimationButton();
    updateOrientationUI();
    loadExtraSettings();
    wireExtraSettings();
    wireDateToggle();
    wireDesignPicker();
    wireViewControls();
    wireBgAndX();
  }catch(e){showErr('init: '+e.message)}
}

if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);
else initApp();
</script>
</body>
</html>
